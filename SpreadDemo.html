<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spread Operator</title>
</head>
<body>
    <h1>Spread Operator in ES6</h1>
    <p>ES6 provides a new operator called spread operator that consists of three dots (...).
    The spread operator allows you to spread out elements of an iterable object such as 
    an array, map, or set.</p>

    <script>
        const odd=[1,3,5];
        const even=[2,4,6];
        const combined=[2,4,6, ...odd];
        const oddeven=[...odd,...even];
        const t1=[1,...even,10];

        document.write(combined+"<br>");
        document.write(oddeven+"<br>");
        document.write(t1);
    </script>
</body>
</html>
