<!DOCTYPE html>
<html>
<head>
    <title>Consume REST API</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            text-align: center;
        }

        .container {
            width: 500px;
            margin: 30px auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        button {
            padding: 10px 20px;
            background: green;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            text-align: left;
            font-size: 18px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Consume REST API using Fetch</h2>

    <button onclick="getUser()">Get User Details</button>

    <div id="result"></div>
</div>

<script>
function getUser() {

    fetch("https://jsonplaceholder.typicode.com/users/1")
    .then(response => response.json())
    .then(user => {

        document.getElementById("result").innerHTML =
        "<b>ID:</b> " + user.id + "<br>" +
        "<b>Name:</b> " + user.name + "<br>" +
        "<b>Username:</b> " + user.username + "<br>" +
        "<b>Email:</b> " + user.email + "<br>" +
        "<b>Phone:</b> " + user.phone + "<br>" +
        "<b>Website:</b> " + user.website;

    })
    .catch(error => {
        document.getElementById("result").innerHTML =
        "Error: " + error;
    });

}
</script>

</body>
</html>
