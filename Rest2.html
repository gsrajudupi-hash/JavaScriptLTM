<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Users REST API Example</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:linear-gradient(135deg,#141E30,#243B55);
    color:white;
    padding:30px;
}

.container{
    width:90%;
    margin:auto;
    background:white;
    color:black;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 15px rgba(0,0,0,0.5);
}

h1{
    text-align:center;
    color:#0d47a1;
    margin-bottom:20px;
}

button{
    display:block;
    margin:0 auto 20px;
    padding:12px 25px;
    font-size:18px;
    background:#0d6efd;
    color:white;
    border:none;
    border-radius:6px;
    cursor:pointer;
}

button:hover{
    background:#084298;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#0d6efd;
    color:white;
    padding:12px;
}

td{
    padding:10px;
    text-align:center;
    border-bottom:1px solid #ddd;
}

tr:nth-child(even){
    background:#f2f2f2;
}

tr:hover{
    background:#d6e9ff;
}

.loading{
    text-align:center;
    color:red;
    font-size:20px;
    margin:20px;
}
</style>

</head>

<body>

<div class="container">

<h1>Employee Management System</h1>

<button onclick="loadUsers()">Load Employees</button>

<p id="msg" class="loading"></p>

<table id="userTable">

<thead>
<tr>
<th>ID</th>
<th>Name</th>
<th>Username</th>
<th>Email</th>
<th>Phone</th>
<th>City</th>
<th>Company</th>
</tr>
</thead>

<tbody id="tableBody">

</tbody>

</table>

</div>

<script>

function loadUsers(){

document.getElementById("msg").innerHTML="Loading Data...";

fetch("https://jsonplaceholder.typicode.com/users")
.then(response=>response.json())
.then(users=>{

document.getElementById("msg").innerHTML="";

let output="";

users.forEach(user=>{

output += `
<tr>
<td>${user.id}</td>
<td>${user.name}</td>
<td>${user.username}</td>
<td>${user.email}</td>
<td>${user.phone}</td>
<td>${user.address.city}</td>
<td>${user.company.name}</td>
</tr>
`;

});

document.getElementById("tableBody").innerHTML=output;

})

.catch(error=>{

document.getElementById("msg").innerHTML="Unable to Load Data";

console.log(error);

});

}

</script>

</body>
</html>
